<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video — ERA FieldOPS</title>
<!-- unlisted until the arrangement is approved -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050816">
<link rel="preload" href="../assets/fonts/Satoshi-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  .nav { background: rgba(5, 8, 22, 0.72); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border-bottom-color: var(--border); }
  .nav-inner { justify-content: space-between; }

  .v-page { padding: calc(var(--nav-h) + var(--space-5)) 0 var(--space-6); }
  .v-head { max-width: 760px; margin-bottom: var(--space-5); }
  .v-head h1 { font-size: clamp(2.2rem, 4.6vw, 3.6rem); }
  .v-head .lead { margin-top: var(--space-2); }

  .v-section { margin-top: var(--space-6); }
  .v-section:first-of-type { margin-top: 0; }
  .v-section-head { max-width: 680px; margin-bottom: var(--space-3); }
  .v-section-head h2 { font-size: clamp(1.5rem, 2.6vw, 2.1rem); }
  .v-section-head p { margin-top: 8px; color: var(--text-2); }

  .v-grid { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
  .v-grid[data-cols="2"] { grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); }
  .v-grid[data-cols="4"] { grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
  .v-grid.is-shorts { grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
  @media (max-width: 520px) { .v-grid.is-shorts { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; } }
  @media (min-width: 760px) { .v-card.is-wide { grid-column: span 2; } }

  .v-card { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .v-card h3 { font-size: 1.08rem; line-height: 1.35; }
  .v-meta { font-size: 0.85rem; color: var(--text-3); margin-top: 4px; }
  .v-meta a:hover { color: var(--text-2); }
  .v-caption { font-size: 0.94rem; color: var(--text-2); margin-top: 6px; }

  /* poster that becomes the player on click — no YouTube request until then */
  .v-player {
    position: relative; aspect-ratio: 16 / 9; width: 100%;
    border-radius: var(--radius-sm); overflow: hidden;
    border: 1px solid var(--border);
    background: radial-gradient(circle at 30% 20%, rgba(79,125,255,0.25), transparent 60%), var(--bg-2);
  }
  .is-shorts .v-player { aspect-ratio: 9 / 16; }
  .v-player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .v-poster {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; padding: 0; border: 0; background: none; color: #fff;
  }
  .v-poster img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s var(--ease), filter 0.3s var(--ease); }
  .v-poster:hover img { transform: scale(1.04); filter: brightness(1.08); }
  .v-play {
    position: absolute; left: 50%; top: 50%; translate: -50% -50%;
    width: 64px; height: 64px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--grad); box-shadow: 0 8px 32px rgba(79,125,255,0.5), 0 0 0 1px rgba(255,255,255,0.15) inset;
    transition: transform 0.25s var(--ease);
  }
  .v-poster:hover .v-play { transform: scale(1.1); }
  .v-play svg { width: 24px; height: 24px; margin-left: 3px; }
  .v-badge {
    position: absolute; right: 10px; bottom: 10px;
    padding: 2px 8px; border-radius: 6px;
    background: rgba(5, 8, 22, 0.82); font-size: 0.78rem; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .v-out { position: absolute; left: 10px; bottom: 10px; padding: 2px 8px; border-radius: 6px; background: rgba(5, 8, 22, 0.82); font-size: 0.75rem; }

  .v-featured { display: grid; gap: var(--space-4); align-items: center; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }
  .v-featured .v-player { border-radius: var(--radius); box-shadow: 0 24px 80px rgba(0,0,0,0.45), 0 0 0 1px rgba(79,125,255,0.18); }
  .v-featured .v-play { width: 84px; height: 84px; }
  .v-featured .v-play svg { width: 30px; height: 30px; }
  .v-featured h2 { font-size: clamp(1.5rem, 2.6vw, 2.2rem); }
  .v-featured .v-caption { font-size: 1.02rem; margin-top: var(--space-2); }
  .v-featured.is-vertical { grid-template-columns: minmax(0, 360px) minmax(0, 1fr); }
  .v-featured.is-vertical .v-player { aspect-ratio: 9 / 16; }
  @media (max-width: 860px) { .v-featured, .v-featured.is-vertical { grid-template-columns: 1fr; } }

  .v-unplaced { padding: var(--space-4) var(--space-3); border: 1px dashed var(--border-strong); border-radius: var(--radius); }
  .v-unplaced .eyebrow { color: var(--warning); }
  .v-note { font-size: 0.88rem; color: var(--warning); margin-top: 6px; }
  .v-note::before { content: '„'; } .v-note::after { content: '”'; }

  .v-empty { max-width: 640px; padding: var(--space-4); border: 1px dashed var(--border-strong); border-radius: var(--radius); color: var(--text-2); }
  .v-empty code { color: var(--ai); }

  @media (prefers-reduced-motion: reduce) {
    .v-poster img, .v-play { transition: none; }
    .v-poster:hover img, .v-poster:hover .v-play { transform: none; }
  }
</style>
</head>
<body>

<header class="nav">
  <div class="container nav-inner">
    <a href="../" class="logo" aria-label="ERA FieldOPS — acasă">
      <span class="logo-mark"><svg fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
      <span>ERA Field<em>OPS</em></span>
    </a>
    <a href="../#demo" class="btn btn-primary">Cere demo</a>
  </div>
</header>

<main class="v-page">
  <div class="container" id="app">
    <div class="v-head">
      <span class="eyebrow" id="vEyebrow">Video</span>
      <h1 id="vTitle">Video</h1>
      <p class="lead" id="vIntro" hidden></p>
    </div>
    <div id="vBody"></div>
  </div>
</main>

<script>
(function () {
  'use strict';
  var ID_RE = /^[A-Za-z0-9_-]{11}$/;
  var body = document.getElementById('vBody');

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function fmtDuration(s) {
    if (!s) return '';
    var h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
    var mm = h ? String(m).padStart(2, '0') : String(m);
    return (h ? h + ':' : '') + mm + ':' + String(sec).padStart(2, '0');
  }

  function player(v, start) {
    var box = el('div', 'v-player');
    var watch = 'https://www.youtube.com/watch?v=' + v.id + (start ? '&t=' + start + 's' : '');
    // owner disabled embedding: open on YouTube instead of a player that would only show an error
    var inline = v.embeddable !== false;
    var poster = el(inline ? 'button' : 'a', 'v-poster');
    if (inline) poster.type = 'button';
    else { poster.href = watch; poster.target = '_blank'; poster.rel = 'noopener'; }
    poster.setAttribute('aria-label', 'Redă: ' + (v.title || 'video YouTube'));

    var img = el('img');
    img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
    var remote = 'https://i.ytimg.com/vi/' + v.id + '/hqdefault.jpg';
    img.src = v.thumb || remote;
    img.onerror = function () {
      if (img.src !== remote) img.src = remote;
      else img.style.visibility = 'hidden';
    };
    poster.appendChild(img);
    var play = el('span', 'v-play');
    play.innerHTML = '<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
    poster.appendChild(play);
    if (v.duration) poster.appendChild(el('span', 'v-badge', fmtDuration(v.duration)));
    if (!inline) poster.appendChild(el('span', 'v-out', 'Se deschide pe YouTube ↗'));

    if (inline) poster.addEventListener('click', function () {
      var f = document.createElement('iframe');
      f.src = 'https://www.youtube-nocookie.com/embed/' + v.id + '?autoplay=1&rel=0&playsinline=1' + (start ? '&start=' + start : '');
      f.title = v.title || 'Video YouTube';
      f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      f.allowFullscreen = true;
      // YouTube refuses embeds that arrive without a referrer
      f.referrerPolicy = 'strict-origin-when-cross-origin';
      box.replaceChild(f, poster);
    });
    box.appendChild(poster);
    return box;
  }

  function meta(v) {
    var m = el('p', 'v-meta');
    if (v.channel) {
      if (v.channel_url) {
        var a = el('a', null, v.channel);
        a.href = v.channel_url; a.target = '_blank'; a.rel = 'noopener';
        m.appendChild(a);
      } else m.appendChild(document.createTextNode(v.channel));
    }
    if (v.duration) m.appendChild(document.createTextNode((v.channel ? ' · ' : '') + fmtDuration(v.duration)));
    return m;
  }

  // item = layout entry ("id" or {id, title?, caption?, start?, wide?}) merged over the catalog record
  function resolve(item, catalog) {
    var o = typeof item === 'string' ? { id: item } : item || {};
    if (!ID_RE.test(o.id || '')) return null;
    var v = catalog[o.id] || { id: o.id };
    return {
      v: v,
      title: o.title || v.title || 'Video YouTube',
      caption: o.caption || '',
      start: o.start != null ? o.start : v.start || 0,
      wide: !!o.wide
    };
  }

  function card(r, opts) {
    var c = el('article', 'v-card' + (r.wide ? ' is-wide' : ''));
    c.appendChild(player(r.v, r.start));
    var txt = el('div');
    txt.appendChild(el('h3', null, r.title));
    txt.appendChild(meta(r.v));
    if (r.caption) txt.appendChild(el('p', 'v-caption', r.caption));
    if (opts && opts.note && r.v.note) txt.appendChild(el('p', 'v-note', r.v.note));
    c.appendChild(txt);
    return c;
  }

  function featured(r) {
    var s = el('section', 'v-section v-featured' + (r.v.vertical ? ' is-vertical' : ''));
    s.setAttribute('aria-label', 'Video principal');
    s.appendChild(player(r.v, r.start));
    var txt = el('div');
    txt.appendChild(el('h2', null, r.title));
    txt.appendChild(meta(r.v));
    if (r.caption) txt.appendChild(el('p', 'v-caption', r.caption));
    s.appendChild(txt);
    return s;
  }

  function section(title, desc, items, opts) {
    var s = el('section', 'v-section' + (opts.unplaced ? ' v-unplaced' : ''));
    var head = el('div', 'v-section-head');
    if (opts.eyebrow) head.appendChild(el('span', 'eyebrow', opts.eyebrow));
    if (title) head.appendChild(el('h2', null, title));
    if (desc) head.appendChild(el('p', null, desc));
    s.appendChild(head);
    var grid = el('div', 'v-grid');
    if (opts.columns) grid.setAttribute('data-cols', String(opts.columns));
    // a section of only Shorts gets portrait tiles; mixed sections stay 16:9
    if (items.length && items.every(function (r) { return r.v.vertical; })) grid.classList.add('is-shorts');
    items.forEach(function (r) { grid.appendChild(card(r, opts)); });
    s.appendChild(grid);
    return s;
  }

  function render(catalogData, layout) {
    var list = (catalogData && catalogData.videos) || [];
    var catalog = {};
    list.forEach(function (v) { catalog[v.id] = v; });
    layout = layout || {};

    if (layout.eyebrow) document.getElementById('vEyebrow').textContent = layout.eyebrow;
    if (layout.title) {
      document.getElementById('vTitle').textContent = layout.title;
      document.title = layout.title + ' — ERA FieldOPS';
    }
    if (layout.intro) {
      var intro = document.getElementById('vIntro');
      intro.textContent = layout.intro; intro.hidden = false;
    }

    var placed = {};
    if (layout.featured) {
      var f = resolve(layout.featured, catalog);
      if (f) { placed[f.v.id] = true; body.appendChild(featured(f)); }
    }
    (layout.sections || []).forEach(function (s) {
      var items = (s.videos || []).map(function (i) { return resolve(i, catalog); }).filter(Boolean);
      items.forEach(function (r) { placed[r.v.id] = true; });
      if (items.length) body.appendChild(section(s.title, s.description, items, { columns: s.columns }));
    });

    var rest = list.filter(function (v) { return !placed[v.id]; });
    if (rest.length && layout.show_unplaced !== false) {
      body.appendChild(section('De aranjat', 'Adăugate în links.txt, dar încă neplasate în layout.json.',
        rest.map(function (v) { return resolve(v.id, catalog); }), { unplaced: true, note: true, eyebrow: rest.length + ' noi' }));
    }

    if (!list.length && !body.children.length) {
      var e = el('div', 'v-empty');
      e.innerHTML = 'Niciun video încă. Lipește linkuri YouTube în <code>videos/links.txt</code> (câte unul pe rând) — ' +
        'restul se întâmplă automat.';
      body.appendChild(e);
    }
  }

  function getJSON(url) {
    return fetch(url, { cache: 'no-cache' }).then(function (r) {
      if (r.status === 404) return null;
      if (!r.ok) throw new Error(url + ': HTTP ' + r.status);
      return r.json();
    });
  }

  Promise.all([getJSON('catalog.json'), getJSON('layout.json')])
    .then(function (d) { render(d[0], d[1]); })
    .catch(function (err) {
      var e = el('div', 'v-empty', 'Nu am putut încărca lista de video (' + err.message + '). ' +
        'Pagina trebuie deschisă de pe site sau printr-un server local, nu direct ca fișier.');
      body.appendChild(e);
    });
})();
</script>
</body>
</html>
